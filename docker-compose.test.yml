# Throwaway PostgreSQL for the storage integration tests only (see docs/TESTING.md).
# Not used by the bot. Data lives in tmpfs and disappears on `down`.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: bell
      POSTGRES_PASSWORD: bell-local-test-only
      POSTGRES_DB: bell_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bell -d bell_test"]
      interval: 2s
      timeout: 5s
      retries: 20
