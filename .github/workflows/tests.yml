name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (Python ${{ matrix.python-version }}, no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # README: Python 3.10 or newer.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile sources
        run: python -m compileall -q bot.py agent_core.py agent_tools.py agentic_automation.py crush_game.py groq_budget.py storage.py db docs tests
      - name: Run tests (PostgreSQL integration tests skip without a database)
        run: python -m pytest -q -rs

  postgres:
    name: postgres integration (Python ${{ matrix.python-version }}, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI container only; not a secret and not used anywhere else.
          POSTGRES_USER: bell
          POSTGRES_PASSWORD: bell-ci-only
          POSTGRES_DB: bell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bell -d bell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BELL_TEST_DATABASE_URL: postgresql://bell:bell-ci-only@localhost:5432/bell_test
      # Fail (instead of skip) if the service is unreachable.
      BELL_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: PostgreSQL integration tests
        run: python -m pytest -q -m postgres tests/test_storage_postgres_integration.py
      - name: Full suite with the database available
        run: python -m pytest -q
